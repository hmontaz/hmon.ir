	<script>
		String.prototype.toCamelCase = function () {
			function _do(s, c) {
				var split = s.split(c[0]);
				for (var i = 0; i < split.length; i++) {
					if (split[i].length < 2) continue;
					split[i] = split[i].toUpperCase().substr(0, 1) + split[i].substring(1);
				}
				return split.join(c[0]);
			}
			var temp = this;
			temp = _do(temp, ' ');
			temp = _do(temp, '-');
			return temp;
		}
