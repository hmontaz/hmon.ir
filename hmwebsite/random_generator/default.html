<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title></title>
	<link href="resources/stylesheets/theme-default.css" rel="stylesheet" />
	<link href="resources/stylesheets/theme-dark.css" rel="stylesheet" />
	<script src="../resources/jquery/jquery.3.2.1_jquery.js"></script>
	<script src="resources/scripts/RandomGenerator.js"></script>
	<script src="resources/scripts/GuitarNeck.js"></script>
	<script src="resources/scripts/GuitarNote.js"></script>
	<script src="resources/scripts/MusicalNote.js"></script>
</head>
<body>

	<!--<input type="range" min="1" max="60" value="20" oninput="//moveSlider(this, 'x')" />-->
	<table>
		<tr>
			<td><label>Number of Strings</label></td>
			<td><input type="number" value="7" id="txtNumberOfStrings" /></td>
		</tr>
	</table>
	<div id="guitar-neck-container">

	</div>
	<table style="width:100%">
		<tr>
			<td>
				<div id="form1">
					<fieldset>
						<legend>All Neck</legend>
						<table>
							<tr>
								<td><label>Strings</label></td>
								<td><input type="text" value="1,2,3" id="txtStringNumbers" /></td>
							</tr>
							<tr>
								<td><label>Frets</label></td>
								<td><input type="text" value="3,5,7,9" id="txtFretNumbers" /></td>
							</tr>
							<tr>
								<td><label>Delay<sup>(sec)</sup></label></td>
								<td><input type="text" value="2" id="txtDelay" /></td>
							</tr>
						</table>
						<br />
						<input type="button" value="Generate" onclick="generate()" />
					</fieldset>
				</div>
			</td>
		</tr>
	</table>
	<script type="text/javascript">
		function parseRange(s) {
			if (s.indexOf(',') != -1) {
				let result = []
				let split = s.split(',').map(a => parseRange(a));
				for (var item of split) {
					if (Array.isArray(item))
						result.push(...item);
					else
						result.push(item);
				}
				return result;
			}
			if (s.indexOf('-') != -1) {
				let start = +s.split('-')[0];
				let stop = +s.split('-')[1];
				return Array.from({ length: stop - start + 1 }, (value, index) => start + index);
			}
			return + s;

		}
		function generate() {
			let prev = null;
			$('#guitar-neck-container').html('');
			let guitarNeck = new GuitarNeck({
				numberOfStrings: parseInt($('#txtNumberOfStrings').val()),
				container: $('#guitar-neck-container')
			});
			let generator = new RandomGenerator(guitarNeck.options.numberOfStrings, guitarNeck.options.numberOfFrets);
			let delay = +$('#txtDelay').val() * 1000;
			let f = function () {
				let note = null;
				//do {
				let o = {
					stringNumbers: [],
					fretNumbers: [],
				};
				let s_stringNumbers = $('#txtStringNumbers').val()
				let s_fretNumbers = $('#txtFretNumbers').val()
				if (s_stringNumbers != '') o.stringNumbers = parseRange(s_stringNumbers)
				if (s_fretNumbers != '') o.fretNumbers = parseRange(s_fretNumbers)
				note = generator.generate(o);
				//} while (prev && prev.stringNumber == note.stringNumber && prev.fretNumber == note.fretNumber)
				prev = note;
				guitarNeck.clear();
				let item = guitarNeck.addNote(note.stringNumber, note.fretNumber, ' ');

				setTimeout(function () {
					item.setText(item.musicalNote.toString())
				}, delay)
			};
			f();
		};
		generate();

	</script>

</body>
</html>
