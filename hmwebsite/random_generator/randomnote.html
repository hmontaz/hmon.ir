<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Random Note</title>
	<link href="resources/stylesheets/theme-default.css" rel="stylesheet" />
	<link href="resources/stylesheets/theme-dark.css" rel="stylesheet" />
	<script src="../resources/jquery/jquery.3.2.1_jquery.js"></script>
	<script src="resources/scripts/RandomNoteGenerator.js"></script>
	<script src="resources/scripts/MusicalNote.js"></script>

</head>
<body>
	<div style="-ms-zoom: 2; zoom: 2;">
		<div id="divNote" style="font-size:200px;text-align:center;height:300px;">
			C
		</div>
		<div style="text-align:center;">
			<input id="btnGenerate" type="button" value="Generate" onclick="generate()" />
		</div>
	</div>
	<script type="text/javascript">
		function generate() {
			let div = $('#divNote').html('');

			let generator = new RandomNoteGenerator()
			let note = generator.generate()
			console.log(note)
			div.html(note)
			$('#btnGenerate').focus()
		}
		generate()
	</script>

</body>
</html>
