	<script>
		var handler = null;

		$(document).ready(function () {
			handler = new UIHandler();
			//setTimeout(function () { $(window).resize(); }, 500);
			//setTimeout(function () { $(window).resize(); }, 1000);
			//setTimeout(function () { $(window).resize(); }, 2000);
		});
		var divMain = $('#divMain');
		$(window).on('load', function (e) {
			//console.log('loaded')
			$(window).resize();
		});
		$(window).resize(function (e) {
			//divMain

			var w = $(window).width();
			var h = $(window).height();

			var zoomFactor_w = w / divMain.width();
			var zoomFactor_h = h / (divMain.height() + 24);
			//console.log(`${zoomFactor_w} ${zoomFactor_h}`)
			var zoomFactor = Math.floor(Math.min(zoomFactor_w, zoomFactor_h) * 10) / 10;
			divMain.css({
				//'border': 'solid 1px black',
				'zoom': zoomFactor
			});
			handler.resize();
			//console.log(zoomFactor)
			//console.log(`w: ${w} h: ${h} ${zoomFactor}`)
		});

	</script>
