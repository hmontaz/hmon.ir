<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Mode Practice</title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.js"></script>
	<script src="resources/scripts/data.js"></script>
	<script src="resources/scripts/ModePracticeUI.js"></script>

	<link href="resources/css/theme_default.css" rel="stylesheet" />
	<link href="resources/css/theme_dark.css" rel="stylesheet" />
	<link href="../resources/hm-glyphs/style.css" rel="stylesheet" />
</head>
<body style="padding:5px; zoom:2;">
	<div id="div_title" style="font-size:40px;height:50px;"></div>
	<ul id="list_tonics"></ul>
	<ul id="list_modes"></ul>
	<!-- 1. The <iframe> (and video player) will replace this <div> tag. -->
	<div id="player"></div>
	<div></div>

	<i onclick="ui.playVideo()" class="button hmg-action-start-alt" id="action-play"></i>
	<i onclick="ui.pauseVideo()" class="button hmg-action-pause-alt" id="action-pause"></i>
	<i onclick="ui.stopVideo()" class="button hmg-action-stop-alt" id="action-stop"></i>
	<i onclick="ui.toggleShuffle()" class="button hmg-dice" id="action-toggle-shuffle"></i>
	<i onclick="ui.togglePlayer()" class="button hmg-display" id="action-toggle-player"></i>
	<!--<i onclick="ui.toggleMute()" class="button hmg-speaker-disabled"></i>-->
	<script>
		//let index = 0;
		//let video = modes[0]
		// 2. This code loads the IFrame Player API code asynchronously.
		var tag = document.createElement('script');

		tag.src = "https://www.youtube.com/iframe_api";
		var firstScriptTag = document.getElementsByTagName('script')[0];
		firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

		// 3. This function creates an <iframe> (and YouTube player)
		//    after the API code downloads.
		let ui;
		function onYouTubeIframeAPIReady() {
			const player = new YT.Player('player', {
				width: '400',
				height: '200',
				videoId: '8tPnX7OPo0Q',//blank video
				playerVars: {
					'playsinline': 1,
				},
				events: {
					'onReady': onPlayerReady,
					'onStateChange': onPlayerStateChange
				}
			});
			ui = new ModePracticeUI({
				data: modes,
				player: player
			})
			//player.playVideo()
		}

		// 4. The API will call this function when the video player is ready.
		function onPlayerReady(event) {
			ui.updateUIState()
			//event.target.playVideo();
			//player.playVideo()
		}

		// 5. The API calls this function when the player's state changes.
		//    The function indicates that when playing a video (state=1),
		//    the player should play for six seconds and then stop.
		//var done = false;
		function onPlayerStateChange(event) {
			ui.updateUIState()
			//if (event.data == YT.PlayerState.PLAYING && !done) {
			//	setTimeout(stopVideo, 6000);
			//	done = true;
			//}
		}

	</script>
</body>
</html>
