	<div class="controls">
		<table>
			<tr>
				<!--<td><label>Strings: <input type="number" id="strings" min="1" value="6" onchange="fretboard.renderFretboard()" /></label></td>-->
				<!--<td><label>Frets: <input type="number" id="frets" min="1" value="24" onchange="fretboard.renderFretboard()" /></label></td>-->
				<td><button onclick="fretboard.download('svg')"><i class="hmg-download"></i> Download SVG</button></td>
				<td><button onclick="fretboard.download('png')"><i class="hmg-download"></i> Download PNG</button></td>
				<td class="divider"><i class="hmg-divider"></i></td>
				<td id="colors"></td>
				<td class="divider"><i class="hmg-divider"></i></td>
				<td><button onclick="window.clearNotes()"><i class="hmg-action-cancel"></i> Clear </button></td>
			</tr>
		</table>

	<div id="fretboard-container"></div>
	<div id="keyboard-container"></div>

	<script type="module">
		import Fretboard from '../dist/src/music/GuitarVisualizer.js';
		import KeyboardVisualizer from '../dist/src/music/KeyboardVisualizer.js';
		import Midi from '../dist/src/music/MIDI.js';
		import MIDINote from '../dist/src/music/MIDINote.js';
		import SVGTools from '../dist/src/SVGTools.js'

		window.fretboard = new Fretboard('fretboard-container')
		window.keyboard = new KeyboardVisualizer('keyboard-container');
		var availableColors = fretboard.getAvailableColors()

		availableColors.forEach(function (color) {
			var colorBox = document.createElement('span')
			colorBox.title = color.name
			colorBox.className = 'color-box'// + color.defaultColor
			SVGTools.expandStyle(colorBox, color.defaultStyle)
			colorBox.setAttribute('data-color', color.name)
			colorBox.onclick = function () {
				var colorName = this.getAttribute('data-color')
				fretboard.setColor(colorName)
				keyboard.setColor(colorName)
			}
			/*colorBox.onclick = function () {
				document.querySelectorAll('.color-box').forEach(box => box.classList.remove('selected'));
				this.classList.add('selected');
				fretboard.setColor(this.getAttribute('data-color'));
			}*/
			document.getElementById('colors').appendChild(colorBox)
		})

		fretboard.setColor('Red')
		keyboard.setColor('Red')

		// Instantiate MIDI listener
		const midi = new Midi();

		// Connect MIDI note events to keyboard
		midi.setNoteOnHandler((noteNumber) => {
			window.fretboard.turnNoteOn(noteNumber);
			window.keyboard.turnNoteOn(noteNumber);
		});

		midi.setNoteOffHandler((noteNumber) => {
			window.fretboard.turnNoteOff(noteNumber);
			window.keyboard.turnNoteOff(noteNumber);
		});

		window.clearNotes = () => {
			window.fretboard.clearFrets()
			window.keyboard.clearKeys()
		}

	</script>
